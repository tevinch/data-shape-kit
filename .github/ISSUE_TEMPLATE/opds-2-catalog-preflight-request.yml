name: OPDS 2.0 catalog preflight request
description: Request a fixed-price offline review of one already-public catalog snapshot.
title: "[OPDS 2.0 catalog preflight] "
body:
  - type: markdown
    attributes:
      value: |
        Choose one fixed scope: USD 25 Report covers up to 250 publications and 2 MB with no file changes; USD 75 Correct covers up to 2,500 publications and 5 MB with requester-supplied replacement values, a change log, and a second report; USD 150 Full covers up to 10,000 publications and 10 MB with the Correct delivery, a supported-findings review, and one in-scope revision.

        Use an invented excerpt or content that is already public. Real work accepts one public, authentication-free OPDS 2.0 JSON snapshot only, supplied by its owner or controller. Do not share contact-email, authentication, credential, token, session, DRM, price, private, restricted, personal, confidential, identity, or unpublished data. Paid, borrowed, subscribed, personalized, or production catalogs are outside scope. No reader, catalog server, hosting, or account access, login, live URL retrieval, publication download, import, subscription, publication, deployment, upload, payment processing, infrastructure change, or security work is included. The static check does not guarantee HTTP behavior, MIME handling, or reader acceptance, availability, traffic, or sales.

  - type: dropdown
    id: tier
    attributes:
      label: Fixed-price tier
      options:
        - USD 25 Report — up to 250 publications and 2 MB; supported static report only
        - USD 75 Correct — up to 2,500 publications and 5 MB; supplied corrections, change log, and second report
        - USD 150 Full — up to 10,000 publications and 10 MB; Correct delivery, findings review, and one revision
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Catalog review goal
      description: Describe the public catalog and the reader-facing decision the report should support.
      placeholder: Review one public catalog snapshot before our authorized publisher handles reader testing.
    validations:
      required: true

  - type: textarea
    id: sample
    attributes:
      label: Synthetic or public excerpt
      description: Paste an invented excerpt or already-public content for at most two publications. Do not attach a real file or include excluded fields or data classes.
      render: json
    validations:
      required: true

  - type: dropdown
    id: publications
    attributes:
      label: Publication count
      options:
        - Up to 250 publications
        - 251 to 2,500 publications
        - 2,501 to 10,000 publications
        - More than 10,000 publications (outside the fixed scope)
    validations:
      required: true

  - type: dropdown
    id: acquisition
    attributes:
      label: Public acquisition mode
      options:
        - Public download or historic open-access only
        - Public preview or historic sample only
        - Both public download and preview
        - Paid, borrowed, subscribed, authenticated, DRM-protected, or restricted (outside scope)
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: State required checks, supplied replacement values, permitted deterministic corrections, and expected outputs.
      placeholder: Report supported feed, collection, publication, acquisition, image, and duplicate findings without source catalog values.
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: Uncompressed file size
      options:
        - No more than 2 MB
        - More than 2 MB and no more than 5 MB
        - More than 5 MB and no more than 10 MB
        - More than 10 MB (outside the fixed scope)
    validations:
      required: true

  - type: input
    id: deadline
    attributes:
      label: Requested delivery date
      description: Provide a date and time zone. Availability is confirmed before work starts.
      placeholder: 2026-09-12, UTC+2
    validations:
      required: true

  - type: checkboxes
    id: data-safety
    attributes:
      label: Public content safety and authorization
      options:
        - label: I confirm that the issue uses invented or already-public content, that I own or control the public catalog, and that neither the issue nor the eligible file contains excluded fields, access markers, relations, or data classes above.
          required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Fixed-scope acknowledgement
      options:
        - label: I understand that the static check does not guarantee HTTP behavior, MIME handling, or reader acceptance and that no account access, live retrieval, download, import, subscription, publication, deployment, or upload is included.
          required: true
