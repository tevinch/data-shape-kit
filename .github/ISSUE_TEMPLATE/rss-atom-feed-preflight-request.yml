name: RSS and Atom feed preflight request
description: Request a fixed-price offline review of one already-public feed snapshot.
title: "[RSS and Atom feed preflight] "
body:
  - type: markdown
    attributes:
      value: |
        Choose one fixed scope: USD 25 Report covers up to 250 entries and 2 MB with no file changes; USD 75 Correct covers up to 2,500 entries and 5 MB with agreed deterministic corrections, a change log, and a second report; USD 150 Full covers up to 10,000 entries and 10 MB with the Correct delivery, a supported-findings review, and one in-scope revision.

        Use an invented excerpt or content that is already public. Real work accepts one public RSS 2.0 or Atom 1.0 snapshot only, supplied by its owner or controller. Do not share contact-email fields or private, authenticated, tokenized, paid-subscriber, password-protected, personalized, regulated, confidential, personal, identity, credential-bearing, unpublished, or production feeds. No feed reader, CMS, hosting, or server access, account login, live URL retrieval, import, subscription, publication, deployment, upload, content review, payment processing, infrastructure change, or security work is included. The static check does not guarantee HTTP behavior, MIME handling, or reader acceptance, publication, availability, traffic, or sales.

  - type: dropdown
    id: tier
    attributes:
      label: Fixed-price tier
      options:
        - USD 25 Report — up to 250 entries and 2 MB; supported static report only
        - USD 75 Correct — up to 2,500 entries and 5 MB; agreed corrections, change log, and second report
        - USD 150 Full — up to 10,000 entries and 10 MB; Correct delivery, findings review, and one revision
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Feed review goal
      description: Describe the public feed and the publication or reader decision the report should support.
      placeholder: Review one public feed snapshot before our authorized publisher handles publication.
    validations:
      required: true

  - type: dropdown
    id: format
    attributes:
      label: Feed format
      options:
        - RSS 2.0
        - Atom 1.0
        - Unknown or mixed (outside the fixed scope)
    validations:
      required: true

  - type: textarea
    id: sample
    attributes:
      label: Synthetic or public excerpt
      description: Paste an invented excerpt or already-public content for up to two entries. Do not attach a real file or include any excluded field or data class.
      render: xml
    validations:
      required: true

  - type: dropdown
    id: entries
    attributes:
      label: Entry count
      options:
        - Up to 250 entries
        - 251 to 2,500 entries
        - 2,501 to 10,000 entries
        - More than 10,000 entries (outside the fixed scope)
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: State required checks, supplied replacement values, permitted deterministic corrections, and expected outputs.
      placeholder: Report supported RSS or Atom structure, required-field, link, date, author-inheritance, and duplicate findings without source feed values.
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: Uncompressed file size
      options:
        - No more than 2 MB
        - More than 2 MB and no more than 5 MB
        - More than 5 MB and no more than 10 MB
        - More than 10 MB (outside the fixed scope)
    validations:
      required: true

  - type: input
    id: deadline
    attributes:
      label: Requested delivery date
      description: Provide a date and time zone. Availability is confirmed before work starts.
      placeholder: 2026-09-12, UTC+2
    validations:
      required: true

  - type: checkboxes
    id: data-safety
    attributes:
      label: Public content safety and authorization
      options:
        - label: I confirm that the issue uses invented or already-public content, that I own or control the public feed, and that neither the issue nor the eligible file contains contact-email fields or any excluded feed type, access marker, or data class above.
          required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Fixed-scope acknowledgement
      options:
        - label: I understand that the static check does not guarantee HTTP behavior, MIME handling, or reader acceptance and that no account access, live retrieval, import, subscription, publication, deployment, or upload is included.
          required: true
