name: Public event calendar file preflight request
description: Request a fixed-price offline review of one public event iCalendar file.
title: "[Public calendar file preflight] "
body:
  - type: markdown
    attributes:
      value: |
        Choose one fixed scope: USD 25 Report covers up to 250 events and 2 MB with no file changes; USD 75 Correct covers up to 2,500 events and 5 MB with agreed deterministic corrections, a change log, and a second report; USD 150 Full covers up to 10,000 events and 10 MB with the Correct delivery, a supported-findings review, and one in-scope revision.

        Use an invented excerpt or content that is already public. Real work accepts one public event calendar file only, supplied by its owner or controller. Files containing ATTENDEE, ORGANIZER, CONTACT, meeting-request, private, confidential, personal, regulated, identity, credential-bearing, tokenized, booking, or unpublished content are refused. No calendar account, Google Calendar, Outlook, WordPress, hosting, or server access, account login, live URL retrieval, import, subscription, invitation sending, recurrence expansion, deployment, upload, payment processing, infrastructure change, or security work is included. The static check does not guarantee platform import, subscription refresh, interoperability, availability, traffic, or sales.

  - type: dropdown
    id: tier
    attributes:
      label: Fixed-price tier
      options:
        - USD 25 Report — up to 250 events and 2 MB; supported static report only
        - USD 75 Correct — up to 2,500 events and 5 MB; agreed corrections, change log, and second report
        - USD 150 Full — up to 10,000 events and 10 MB; Correct delivery, findings review, and one revision
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Public calendar review goal
      description: Describe the public event calendar and the distribution decision the report should support.
      placeholder: Review one public event calendar snapshot before our authorized publisher handles distribution.
    validations:
      required: true

  - type: textarea
    id: sample
    attributes:
      label: Synthetic or public excerpt
      description: Paste a short invented event or an already-public excerpt. Do not attach a real file.
      render: text
    validations:
      required: true

  - type: dropdown
    id: events
    attributes:
      label: Event count
      options:
        - Up to 250 events
        - 251 to 2,500 events
        - 2,501 to 10,000 events
        - More than 10,000 events (outside the fixed scope)
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: State required checks, permitted deterministic corrections, and expected outputs.
      placeholder: Report supported calendar-file findings without source values.
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: Uncompressed file size
      options:
        - No more than 2 MB
        - More than 2 MB and no more than 5 MB
        - More than 5 MB and no more than 10 MB
        - More than 10 MB (outside the fixed scope)
    validations:
      required: true

  - type: input
    id: deadline
    attributes:
      label: Requested delivery date
      description: Provide a date and time zone. Availability is confirmed before work starts.
      placeholder: 2026-09-11, UTC+2
    validations:
      required: true

  - type: checkboxes
    id: data-safety
    attributes:
      label: Public content safety and authorization
      options:
        - label: I confirm that the issue uses invented or already-public event content, that I own or control the public calendar, and that neither the issue nor the eligible file contains any excluded property, content, or data class above.
          required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Fixed-scope acknowledgement
      options:
        - label: I understand the unsupported validation areas and outcome limits above and that no calendar account access, live retrieval, import, subscription, invitation sending, recurrence expansion, deployment, or upload is included.
          required: true
