name: JSON-LD preflight request
description: Request a fixed-price offline review of JSON-LD in one already-public HTML snapshot.
title: "[JSON-LD preflight] "
body:
  - type: markdown
    attributes:
      value: |
        Choose one fixed scope: USD 25 Report covers up to 25 JSON-LD scripts and 2 MB with no file changes; USD 75 Correct covers up to 100 scripts and 5 MB with agreed deterministic JSON-LD corrections, a change log, and a second report; USD 150 Full covers up to 250 scripts and 10 MB with the Correct delivery, a supported-findings review, and one in-scope revision.

        Use an invented excerpt or content that is already public. Real work accepts a public HTML snapshot only, supplied by its owner or controller. Do not share private, staging, password-protected, personalized, regulated, confidential, personal, identity, credential-bearing, or unpublished pages. No Search Console, WordPress, SEO-tool, hosting, or server access, account login, live URL retrieval, script execution, remote-context retrieval, deployment, upload, validation submission, payment processing, infrastructure change, or security work is included. The static check does not validate schema.org vocabulary, Google feature-specific requirements, truthfulness, or policy compliance and does not guarantee rich-result eligibility, appearance, ranking, traffic, or sales.

  - type: dropdown
    id: tier
    attributes:
      label: Fixed-price tier
      options:
        - USD 25 Report — up to 25 JSON-LD scripts and 2 MB; supported static report only
        - USD 75 Correct — up to 100 JSON-LD scripts and 5 MB; agreed corrections, change log, and second report
        - USD 150 Full — up to 250 JSON-LD scripts and 10 MB; Correct delivery, findings review, and one revision
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Page review goal
      description: Describe the already-public page and the release decision the report should support.
      placeholder: Review JSON-LD in one public page snapshot before our authorized site owner handles release.
    validations:
      required: true

  - type: textarea
    id: sample
    attributes:
      label: Synthetic or public excerpt
      description: Paste one invented JSON-LD block or a small already-public excerpt. Do not attach a real file.
      render: json
    validations:
      required: true

  - type: dropdown
    id: scripts
    attributes:
      label: JSON-LD script count
      options:
        - Up to 25 scripts
        - 26 to 100 scripts
        - 101 to 250 scripts
        - More than 250 scripts (outside the fixed scope)
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: State required checks, permitted deterministic corrections, and expected outputs.
      placeholder: Report supported JSON-LD syntax and shape findings without source values.
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: Uncompressed file size
      options:
        - No more than 2 MB
        - More than 2 MB and no more than 5 MB
        - More than 5 MB and no more than 10 MB
        - More than 10 MB (outside the fixed scope)
    validations:
      required: true

  - type: input
    id: deadline
    attributes:
      label: Requested delivery date
      description: Provide a date and time zone. Availability is confirmed before work starts.
      placeholder: 2026-09-11, UTC+2
    validations:
      required: true

  - type: checkboxes
    id: data-safety
    attributes:
      label: Public content safety and authorization
      options:
        - label: I confirm that the issue uses invented or already-public content, that I own or control the public page, and that neither the issue nor the eligible file contains any excluded page type or data class above.
          required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Fixed-scope acknowledgement
      options:
        - label: I understand the unsupported validation areas and outcome limits above and that no account access, live retrieval, script execution, remote-context retrieval, deployment, upload, or validation submission is included.
          required: true
