[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "data-shape-kit"
version = "0.1.0"
description = "Local, deterministic CSV normalization and deduplication"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Tevinch" }]
dependencies = []

[project.scripts]
data-shape-kit = "data_shape_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
